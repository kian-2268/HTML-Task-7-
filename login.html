<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="style.css">
    <title>LogIn</title>
</head>
<body>
    <div class="container">
        <h2 class="title">LOGIN</h2>

        <form class="form">
            <label class="label">Username</label>
            <input type="email" class="input" placeholder="Enter email address" required>

            <br><br>
            <label class="label">Password</label>
            <input type="password" class="input" placeholder="Enter password" required>

            <br><br>
            <a href="portfolio.html" class="btn">Log In</a>
        </form>

        <p class="text">Don't have an account? <a href="register.html" class="link">Register here!</a></p>
    </div>
</body>
